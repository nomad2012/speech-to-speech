<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Versus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Persona Versus</h1>
        <p>Two personas. One conversation. You start it.</p>
    </header>

    <!-- Setup section (shown before simulation starts) -->
    <div id="setup-container">
        <main>
            <!-- Persona Selection -->
            <section id="selection">
                <div class="persona-select">
                    <label for="persona-a">Persona A</label>
                    <select id="persona-a"></select>
                </div>
                <div class="persona-select">
                    <label for="persona-b">Persona B</label>
                    <select id="persona-b"></select>
                </div>
                <div class="persona-select">
                    <label for="turns-input">Turns</label>
                    <input type="number" id="turns-input" min="2" max="20" value="6">
                </div>
            </section>

            <!-- Topic Input -->
            <section id="topic">
                <label for="topic-input">Your prompt</label>
                <textarea id="topic-input" placeholder="What would you like them to discuss?" rows="3"></textarea>
                <button id="start-btn" class="start-button" disabled>Start Duet</button>
            </section>
        </main>
    </div>

    <!-- Conversation section (shown during simulation) -->
    <div id="duet-container" class="hidden">
        <!-- Topic title -->
        <div id="topic-title" class="topic-title"></div>

        <!-- Left avatar: Persona A -->
        <div class="avatar-column avatar-a">
            <div class="avatar-wrapper">
                <img id="avatar-a" class="avatar-img" src="" alt="" />
                <div id="avatar-label-a" class="avatar-label"></div>
            </div>
        </div>

        <!-- Center: scrollable conversation -->
        <div class="turns-column">
            <div id="turns" class="turns"></div>
        </div>

        <!-- Right avatar: Persona B -->
        <div class="avatar-column avatar-b">
            <div class="avatar-wrapper">
                <img id="avatar-b" class="avatar-img" src="" alt="" />
                <div id="avatar-label-b" class="avatar-label"></div>
            </div>
        </div>

        <!-- Stop button -->
        <div class="controls-bar">
            <button id="stop-btn" class="stop-button">Stop</button>
        </div>
    </div>

    <!-- Status -->
    <div id="status-bar">
        <span id="status-text">Select personas and enter a topic to start</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
