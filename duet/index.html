<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Duet — F5</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101318;
    --panel: #171b22;
    --panel-2: #1d232c;
    --border: #2a323e;
    --ink: #e8e6df;
    --muted: #97a0ad;
    --accent: #c9a86a;
    --accent-ink: #14161a;
    --a-tint: #26313d;
    --b-tint: #2d2620;
    --danger: #b45f5f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f2ec;
      --panel: #ffffff;
      --panel-2: #f8f7f3;
      --border: #ddd8cc;
      --ink: #24282e;
      --muted: #6b7280;
      --accent: #8a6d3b;
      --accent-ink: #ffffff;
      --a-tint: #eef2f6;
      --b-tint: #f6f1ea;
      --danger: #a33;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--bg);
    margin: 0; padding: 24px 16px 48px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: .01em; }
  h1 .vs { color: var(--accent); font-weight: 400; }
  .sub { color: var(--muted); font-size: .85rem; margin-top: 4px; }

  form {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 8px;
  }
  form .row2 { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select, input[type=text], input[type=number] {
    padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--ink); font: inherit; width: 100%;
  }
  select option, select optgroup { background: var(--panel-2); color: var(--ink); }
  input[type=text] { flex: 1 1 240px; }
  input[type=number] { width: 76px; }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .vslabel { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
  button {
    padding: 9px 18px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--border); font-weight: 400; }
  #status { font-size: .8rem; color: var(--muted); margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.live .dot { background: #5fae6e; }
  #status.err .dot { background: var(--danger); }

  #stage { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .turn {
    max-width: 78%; border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 14px; background: var(--panel);
    animation: rise .25s ease-out;
  }
  .turn.a { align-self: flex-start; background: var(--a-tint); border-bottom-left-radius: 4px; }
  .turn.b { align-self: flex-end;   background: var(--b-tint); border-bottom-right-radius: 4px; }
  .turn.speaking { outline: 2px solid var(--accent); }
  .who { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
         color: var(--muted); margin-bottom: 4px; }
  .txt { line-height: 1.5; font-family: Georgia, "Iowan Old Style", serif; font-size: 1.02rem; }
  .empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 24px 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Persona Duet <span class="vs">— spoken on the RTX 5070</span></h1>
  <div class="sub">F5-TTS voice cloning · every turn plays automatically, in order.</div>
</header>

<form id="f">
  <select id="a" aria-label="first debater"></select>
  <span class="vslabel">vs</span>
  <select id="b" aria-label="second debater"></select>
  <div class="row2">
    <input type="text" id="topic" placeholder="topic — e.g. the art of diplomacy">
    <input type="number" id="turns" value="6" min="2" max="20" aria-label="turns">
    <button type="submit">Begin</button>
    <button type="button" id="stop" class="ghost">Stop</button>
    <span id="status"><span class="dot"></span><span id="status-text">connecting…</span></span>
  </div>
</form>

<div id="stage"><div class="empty">No duel yet — choose two personas and a topic, and begin.</div></div>
</div>

<script>
const stage = document.getElementById('stage');
const statusBox = document.getElementById('status');
const statusText = document.getElementById('status-text');
let audioQueue = Promise.resolve();
let speakerOf = {};

function setStatus(text, cls) {
  statusText.textContent = text;
  statusBox.className = cls || '';
}

function setSel(personas) {
  for (const [id, def] of [['a','Churchill'],['b','Genghis']]) {
    const el = document.getElementById(id);
    el.innerHTML = personas.map(p => `<option ${p===def?'selected':''}>${p}</option>`).join('');
  }
}

function side(speaker, ev) {
  if (ev && ev.side) return ev.side;
  if (!(speaker in speakerOf))
    speakerOf[speaker] = Object.keys(speakerOf).length ? 'b' : 'a';
  return speakerOf[speaker];
}

function bubble(speaker, text, ev) {
  const div = document.createElement('div');
  div.className = 'turn ' + side(speaker, ev);
  div.innerHTML = `<div class="who">${speaker}</div><div class="txt"></div>`;
  div.querySelector('.txt').textContent = text;
  stage.appendChild(div);
  return div;
}

function playWav(b64, div) {
  const url = 'data:audio/wav;base64,' + b64;
  audioQueue = audioQueue.then(() => new Promise(res => {
    const a = new Audio(url);
    div.classList.add('speaking');
    a.onended = () => { div.classList.remove('speaking'); res(); };
    a.onerror = res;
    a.play().catch(res);
  }));
}

function handle(ev) {
  if (ev.type === 'hello') {
    setSel(ev.personas || []);
    setStatus(ev.running ? 'duet in progress' : 'ready', ev.running ? 'live' : '');
    if (ev.resume) {
      stage.innerHTML = '';
      ev.resume.transcript.forEach(t => bubble(t.speaker, t.text));
    }
  } else if (ev.type === 'start') {
    stage.innerHTML = '';
    speakerOf = {};
    speakerOf[ev.a] = 'a';
    speakerOf[ev.b] = 'b';
    setStatus(`duet: ${ev.a} vs ${ev.b} — “${ev.topic}”`, 'live');
  } else if (ev.type === 'turn') {
    window._last = bubble(ev.speaker, ev.text);
  } else if (ev.type === 'audio') {
    if (window._last) playWav(ev.wav_b64, window._last);
  } else if (ev.type === 'error') {
    setStatus('error: ' + ev.message, 'err');
  } else if (ev.type === 'done') {
    setStatus('finished', '');
  }
}

function connect() {
  const es = new EventSource('/api/stream');
  es.onmessage = m => handle(JSON.parse(m.data));
  es.onerror = () => { setStatus('reconnecting…', ''); es.close(); setTimeout(connect, 2000); };
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const body = { a: document.getElementById('a').value,
                 b: document.getElementById('b').value,
                 topic: document.getElementById('topic').value || 'a matter of consequence',
                 turns: parseInt(document.getElementById('turns').value, 10) };
  const r = await fetch('/api/duet', { method: 'POST',
    headers: {'content-type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) setStatus((await r.json()).detail || 'cannot start', 'err');
});
document.getElementById('stop').addEventListener('click', () => fetch('/api/stop', {method:'POST'}));
connect();
</script>
</body>
</html>
